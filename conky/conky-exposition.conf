-- =============================================================================
--  ~/.config/conky/conky-exposition.conf — bloc EXPOSITION sur le bureau
--  Lit le fichier écrit par « exposition.py client » (aucun accès réseau ici).
--  Lancement : conky -c ~/.config/conky/conky-exposition.conf -d
--  Voir docs/08-poste-conky.md
-- =============================================================================
conky.config = {
    alignment = 'bottom_left',
    gap_x = 30,
    gap_y = 60,
    minimum_width = 470,
    maximum_width = 470,

    background = true,
    double_buffer = true,
    update_interval = 10,
    -- ${catp} est limité à 256 octets par défaut : à augmenter impérativement
    text_buffer_size = 16384,

    use_xft = true,
    font = 'DejaVu Sans Mono:size=9',
    default_color = 'white',
    color1 = '#40E0D0',   -- titres
    color2 = '#DDDDDD',   -- libellés
    draw_shades = true,
    default_shade_color = 'black',   -- ombre : lisible sur fond clair comme sombre

    out_to_x = true,
    out_to_wayland = false,
    own_window = true,
    own_window_class = 'ConkyExposition',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
}

-- Remplacer UTILISATEUR par votre identifiant local (Conky ne développe pas « ~ »)
conky.text = [[
${catp /home/UTILISATEUR/.cache/crise-alertes/exposition.txt}
]]
