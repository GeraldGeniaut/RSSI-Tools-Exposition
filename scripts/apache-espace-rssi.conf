# =============================================================================
#  Bloc à insérer DANS le VirtualHost HTTPS (*:443) du serveur web annexe.
#  Protège le dossier du rapport et y interdit toute exécution de code.
#  Voir docs/06-publication-web.md
#
#  Mot de passe :  htpasswd -c -B /etc/apache2/.htpasswd-rssi admin
#                  chown root:www-data /etc/apache2/.htpasswd-rssi ; chmod 640 ...
#  Vérification :  apache2ctl configtest && systemctl reload apache2
# =============================================================================

        # --- Espace RSSI : rapport d'exposition ---
        <Directory "/var/www/site/rssi">
                AuthType Basic
                AuthName "Espace RSSI - acces restreint"
                AuthBasicProvider file
                AuthUserFile /etc/apache2/.htpasswd-rssi
                Require valid-user
                # Optionnel : restreindre aussi au réseau d'administration
                # Require ip 192.0.2.0/24
                # Aucun listage, aucune exécution de code : HTML/JSON uniquement
                Options -Indexes -ExecCGI
                RemoveHandler .py .pl .cgi
                <IfModule mod_php.c>
                        php_admin_flag engine off
                </IfModule>
                # Couvre aussi PHP-FPM : tout script déposé ici est refusé
                <FilesMatch "\.(php[0-9]?|phtml|phar|py|pl|cgi|sh)$">
                        Require all denied
                </FilesMatch>
        </Directory>
